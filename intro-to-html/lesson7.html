<!DOCTYPE html>
<html>
  <head>
    <title>Images</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/lesson7.css">
  </head>
  <body>
    <div>
      <img src="images/cat-image.jpg" class="cat-rounded-style">
      <p>
        Image of a cat with rounder corners
      </p>
    </div>
    <div>
      <img src="images/cat-image.jpg" class="cat-box-style">
      <p>
        Image of a cat with boxy corners
      </p>
    </div>
    <div>
      <img src="images/cat-image.jpg" class="cat-circle-style">
      <p>
        Image of a cat in a circle
      </p>
    </div>
    <div>
      <p class="search-bar-intro">
        Search Bar Example
      </p>
      <input type="text" placeholder="Search" class="normal-search-bar">
    </div>
    <div>
      <input type="text" placeholder="Search Google or type a URL" class="google-search-bar">
    </div>
    <div>
      <p class="email-text">
        Email
      </p>
      <input type="text"class="email-input-box" class="email-input-box">
      <p class="email-text">
        By clicking Agree & Join, you agree to the Privacy Policy.
      </p>
      <button class="linkedin-btn">
        Agree & Join
      </button>
    </div>
    <div class="profile-exercise">
      <img src="images/cat-image.jpg" class="cat-profile">
      <input type="text" placeholder="What's happening?" class="profile-input-box">
      <button class="tweet-btn">
        Tweet
      </button>
    </div>
  </body>
</html>
