<!DOCTYPE html>
<html>
  <head>
    <title>Grid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      .image-container {
        box-shadow: 0 0 5px 5px rgba(0, 0, 0, 0.2);
      }
      .image-design {
        width: 200px;
        height: 200px;
        object-fit: cover;
      }
      p {
        font-family: Roboto, Arial;
        font-weight: 500;
        margin-top: 0px;
        margin-bottom: 0px;
        margin-left: 10px;
      }
      .mutual-profile {
        width: 36px;
        border-radius: 26px;
        vertical-align: middle;
        margin-left: 8px;
      }
      .profile-name {
        margin-top: 8px;
      }
      .mutual-text{
        font-weight: 400;
        color: rgb(104, 104, 104);
        display: inline-block;
        vertical-align: middle;
      }
      .add-friend-btn {
        margin-top: 10px;
        background-color: rgb(0, 78, 196);
        font-family: Roboto, Arial;
        color: white;
        border: none;
        padding-top: 8px;
        padding-bottom: 8px;
        padding-left: 18px;
        padding-right: 18px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-left: 8px;
        margin-bottom: 8px;
      }
      .add-friend-btn:hover{
        background-color: rgb(1, 87, 216);
      }
    </style>
  </head>
  <body>
    <div
      style="
        display: grid;
        grid-template-columns: 100px 100px;
        margin-bottom: 10px;
      "
    >
      <div style="background-color: lightblue">div 1</div>
      <div style="background-color: lightpink">div 2</div>
    </div>
    <div
      style="
        display: grid;
        grid-template-columns: 200px 75px;
        margin-bottom: 10px;
      "
    >
      <div style="background-color: lightblue">200px</div>
      <div style="background-color: lightpink">75px</div>
    </div>
    <div
      style="
        display: grid;
        grid-template-columns: 50px 1fr 75px;
        margin-bottom: 10px;
      "
    >
      <div style="background-color: lightpink">col1</div>
      <div style="background-color: lightblue">col2</div>
      <div style="background-color: lightpink">col3</div>
    </div>
    <div
      style="
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        column-gap: 20px;
        row-gap: 10px;
        margin-bottom: 20px;
      "
    >
      <div style="background-color: lightpink">col1</div>
      <div style="background-color: lightpink">col2</div>
      <div style="background-color: lightpink">col3</div>
      <div style="background-color: lightpink">col4</div>
      <div style="background-color: lightpink">col1</div>
      <div style="background-color: lightpink">col2</div>
      <div style="background-color: lightpink">col3</div>
      <div style="background-color: lightpink">col4</div>
    </div>

    <div style="display: grid; grid-template-columns: 200px 200px 200px;
      column-gap: 20px;">
      <div class="image-container">
        <img src="images/cat-image.jpg" class="image-design" />
        <p class="profile-name">Mimang</p>
        <img src="images/chihuahua.webp" class="mutual-profile">
        <p class="mutual-text">3 mutual friends</p>
        <button class="add-friend-btn">Add Friend</button>
      </div>
      <div class="image-container">
        <img src="images/dog.webp" class="image-design" />
        <p class="profile-name">Doggo</p>
        <img src="images/chihuahua.webp" class="mutual-profile">
        <p class="mutual-text">3 mutual friends</p>
        <button class="add-friend-btn">Add Friend</button>
      </div>
      <div class="image-container">
        <img src="images/snowball.jpg" class="image-design" />
        <p class="profile-name">Snowball</p>
        <img src="images/chihuahua.webp" class="mutual-profile">
        <p class="mutual-text">3 mutual friends</p>
        <button class="add-friend-btn">Add Friend</button>
      </div>
    </div>

  </body>
</html>
