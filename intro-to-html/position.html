<!DOCTYPE html>
<html>
  <head>
    <title>Position Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      .overlay {
        background-color: rgba(0, 0, 0, 0.8);
        position: fixed;
        top:0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal-container {
        display: flex;
        flex-direction: column;
        background-color: white;
        width: 300px;
        border-radius: 5px;
        padding: 15px;
        align-items: flex-start;
      }
      .modal-title,
      .modal-text,
      .modal-btn {
        font-family: Montserrat;
      }
      .modal-title {
        font-weight: bold;
        margin-top: 5px;
        margin-bottom: 5px;
      }


    </style>
  </head>
  <body style="height: 3000px; padding-top: 60px; padding-left: 80px;">
    <div style="background-color: black; color: white; position: fixed; top: 0; left: 0; right: 0; 
      height: 50px;">header
    </div>
    <div style="background-color: green; color: white; position: fixed; top: 50px; left: 0; bottom: 0;
     width: 72px;">sidebar</div>
    <div style="background-color: lightblue; height: 200px; width: 200px; position: static;">
      div1
    </div>
    <div style="background-color: lightpink; height: 200px; width: 200px">
      div2
    </div>
    <div class="overlay">
      <div class="modal-container">
        <p class="modal-title">Modal Title</p>
        <p class="modal-text">This is a modal</p>
        <button class="modal-btn">Close</button>
      </div>
    </div>
  </body>
</html>
