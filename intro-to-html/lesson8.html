<!DOCTYPE html>
<html>
  <head>
    <title>
      Lesson 8
    </title>
    <link rel="stylesheet" href="styles/lesson8.css">
  </head>
  <body>
    <div>
      <input type="text" placeholder="Name" class="name-txt-box">
      <input type="email" placeholder="Email" class="email-txt-box">
    </div>
    <div>
      <p class="survey-text">
        Thanks for chatting with our 
        customer support. Would you
        like to take our quick survey?
      </p>
      <button class="survey-btn">
        Yes
      </button>
      <button class="survey-btn">
        No
      </button>
    </div>
    <div class="google-search">
      <img src="images/google.webp" class="google-image">
      <input type="text" placeholder="Search Google or type a URl" class="search-bar">
    </div>
    <div class="sign-up-form">
      <input type="text" placeholder="First name" class="first-name-input">
      <input type="text" placeholder="Last name" class="last-name-input">
      <input type="email" placeholder="Email" class="email-input">
      <button class="sign-up-btn">
        Sign Up
    </div>
    <div>
      <p class="ride-text">
        Request a ride now 
      </p>
      <input type="text" placeholder="Enter pickup location" class="ride-input">
      <input type="text" placeholder="Enter destination" class="ride-input">
      <button class="request-ride-btn">
        Request Now
      </button>
      <button class="schedule-later-btn">
        Schedule for later
      </button>
    </div>
  </body>
</html>
