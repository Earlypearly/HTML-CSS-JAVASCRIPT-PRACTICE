<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="rpc.css">
  </head>
  <body>
    <div class="game-container">
      <div class="game-title-container">
        <p>Rock Paper Scissors</p>
      </div>
      <div class="move-icon-container">
        <button onclick="result('rock');">
          <img src="images/rock-emoji.png" class="move-icon" />
        </button>
        <button onclick="result('paper');">
          <img src="images/paper-emoji.png" class="move-icon" />
        </button>
        <button onclick="result('scissors');">
          <img src="images/scissors-emoji.png" class="move-icon" />
        </button>
      </div>
      <div class="js-winner winner-text">
        <p>Pick your move</p>
      </div>
      <div class="js-chosen-move chosen-move-style">
        <p></p>
      </div>
      <div class="js-score">
        <p>Wins: 0, Losses: 0, Ties: 0</p>
      </div>
      <div class="reset-score-container">
        <button onclick="resetScore();">Reset Score</button>
      </div>
    </div>
    <script src="rpc.js"> 
    </script>
  </body>
</html>
