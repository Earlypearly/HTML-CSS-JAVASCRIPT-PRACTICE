<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #222831;
      }
      p {
        font-family: Montserrat, Arial;
        margin: 4px;
        color: white;
      }
      button {
        font-family: Montserrat, Arial;
        margin: 4px;
      }
      .game-container { 
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .game-title-container p {
        font-size: 30px;
        font-weight: 600;
      }
      .move-icon {
        height: 60px;
        padding: 15px;;
        border-radius: 40px;
      }
      .chosen-move-icon {
        height: 40px;
        padding: 5px 10px;
        border-radius: 40px;
      }
      .move-icon-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 140px;
      }
      .move-icon-container button { 
        background-color: #393E46;
        border: 2px solid #DFD0B8;
        border-radius: 50px;
        cursor: pointer;
        padding: 1px;
        transition: padding 0.4s, 
          border-radius 0.4s;
      }
      .move-icon-container button:hover {
        padding: 10px;
        border-radius: 60px;
      }
      .winner-text {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .chosen-move-style p {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 2px ;
      }
      .reset-score-container button{
        background-color: #393E46;
        color: white;
        border: 2px solid #DFD0B8;
        border-radius: 18px;
        padding: 5px 20px;
        cursor: pointer;
        width: 123px;
        height: 30px;
        transition: width 0.40s,
          height 0.4s;
      }
      .reset-score-container button:hover {
        width: 135px;
        height: 32px;
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <div class="game-title-container">
        <p>Rock Paper Scissors</p>
      </div>
      <div class="move-icon-container">
        <button onclick="result('rock');"><img src="images/rock-emoji.png" class="move-icon"></button>
        <button onclick="result('paper');"><img src="images/paper-emoji.png" class="move-icon"></button>
        <button onclick="result('scissors');"><img src="images/scissors-emoji.png" class="move-icon"></button>
      </div>
      <div class="js-winner winner-text">
        <p>Pick your move</p>
      </div>
      <div class="js-chosen-move chosen-move-style">
        <p>
        </p>
      </div>
      <div class="js-score">
        <p>Wins: 0, Losses: 0, Ties: 0</p>
      </div>
      <div class="reset-score-container">
        <button onclick="resetScore();">Reset Score</button>
      </div>
    </div>
    <script>
      let score = JSON.parse(localStorage.getItem('score')) ||
          { wins: 0,
          losses: 0,
          ties: 0 };
      updateScore('Pick Your Move');
      function updateScore(result, computerMove, chosenMove) {
        document.querySelector('.js-score p')
          .innerHTML = `Wins: ${score.wins} Losses: ${score.losses} Ties: ${score.ties}`;
        if(chosenMove) {
           document.querySelector('.js-chosen-move p')
          .innerHTML = `
            You:
            <img src="images/${chosenMove}-emoji.png" class="chosen-move-icon">
            Computer:
            <img src="images/${computerMove}-emoji.png" class="chosen-move-icon">`;
        } else {
          document.querySelector('.js-chosen-move p')
          .innerHTML = 'Pick a move to play';
        }
        document.querySelector('.js-winner p')
          .innerHTML = result;
      }
      function generateRandomNumber() {
        const randomNumber = Math.random();
        let computerMove = '';
        
        if (randomNumber >=0 && randomNumber < 1/3) {
          computerMove = 'rock';
        }
        else if (randomNumber >= 1/3 && randomNumber < 2/3) {
          computerMove = 'paper';
        }
        else if (randomNumber >= 2/3 && randomNumber < 1 ) {
          computerMove = 'scissors';
        }
        return computerMove;
      }

      function result(chosenMove) {
        let computerMove = generateRandomNumber();
        let result = '';
        if (computerMove === chosenMove ) {
          result = 'Tie';
          score.ties++;
        }
        else if (computerMove !== chosenMove) {
          if (computerMove === 'rock' && chosenMove === 'paper'
            || computerMove === 'paper' && chosenMove === 'scissors'
            || computerMove === 'scissors' && chosenMove === 'rock'
          ) {
            result = 'You win'
            score.wins++;
          }
          else {
            result = 'You lose'
            score.losses++;
          }
        }
        localStorage.setItem('score', JSON.stringify(score));
        updateScore(result, computerMove, chosenMove);  
      }
      function resetScore(){
        score.losses = 0;
        score.wins = 0;
        score.ties = 0;
        localStorage.removeItem('score');
        updateScore('Pick Your Move');
      }
    </script> 
  </body>
</html>
